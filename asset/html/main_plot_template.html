<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <script type="text/javascript">
      (function () {
        var origInsertRule = CSSStyleSheet.prototype.insertRule;
        CSSStyleSheet.prototype.insertRule = function (rule, index) {
          try {
            return origInsertRule.call(this, rule, index);
          } catch (e) {
            console.warn("CSS rule skipped: " + rule.substring(0, 50));
            return -1;
          }
        };
      })();
    </script>
    <script type="text/javascript">
      __PLOTLY_JS__;
    </script>
    <script
      type="text/javascript"
      src="qrc:///qtwebchannel/qwebchannel.js"
    ></script>
    <script type="text/javascript">
      __WEB_LOADING_JS__;
    </script>
    <style>
      body {
        background-color: var(--bg-base) !important;
        font-family: "Arial", sans-serif;
        margin: 0;
        padding: 0px;
        display: flex;
        gap: 15px;
        height: 100vh;
        box-sizing: border-box;
        overflow: hidden;
      }
      .left-container {
        flex: 0.45;
        display: flex;
        flex-direction: column;
        gap: 15px;
      }
      .right-container {
        flex: 0.55;
        display: flex;
        flex-direction: column;
      }

      .card {
        background-color: var(--bg-card-secondary);
        border: 1px solid var(--border-base);
        border-radius: 12px;
        position: relative;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .card-title {
        color: var(--text-accent);
        font-weight: bold;
        font-size: 11px;
        padding: 12px 0 0 15px;
        z-index: 10;
      }
      .plot-area {
        flex: 1;
        width: 100%;
        height: 100%;
      }
      .cos-grid {
        display: grid;
        grid-template-columns: 1fr 20px;
        grid-template-rows: 20px 1fr;
        gap: 0px;
        margin: auto;
        overflow: hidden;
      }
      .cos-grid .main {
        grid-column: 1;
        grid-row: 2;
      }
      .cos-grid .top {
        grid-column: 1;
        grid-row: 1;
      }
      .cos-grid .right {
        grid-column: 2;
        grid-row: 2;
      }
    </style>
  </head>
  <body>
    <script>
      function applyTheme(themeObj) {
        for (const [key, value] of Object.entries(themeObj)) {
          const cssVarName = "--" + key.replace(/_/g, "-");
          document.documentElement.style.setProperty(cssVarName, value);
        }
      }

      const currentTheme = __THEME_JSON__;
      applyTheme(currentTheme);
      WebLoading.init(currentTheme);
    </script>
    <div class="left-container">
      <div class="card" style="flex: 0.52">
        <div class="card-title">GPC HEATMAP</div>
        <div id="plot_hm" class="plot-area"></div>
      </div>
      <div
        class="card"
        style="
          flex: 0.48;
          display: flex;
          flex-direction: row;
          gap: 5px;
          padding: 5px;
          overflow: hidden;
        "
      >
        <!-- COS SYNC -->
        <div
          style="
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
          "
        >
          <div class="card-title" style="padding-left: 10px; flex-shrink: 0">
            COS SYNC
          </div>
          <div
            id="sync_container"
            style="
              flex: 1;
              min-height: 0;
              position: relative;
              overflow: hidden;
              padding: 5px;
            "
          >
            <div class="cos-grid" id="sync_grid">
              <div id="plot_sync_top" class="top"></div>
              <div style="grid-column: 2; grid-row: 1"></div>
              <div id="plot_sync_main" class="main"></div>
              <div id="plot_sync_right" class="right"></div>
            </div>
          </div>
        </div>

        <!-- COS ASYNC -->
        <div
          style="
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
          "
        >
          <div class="card-title" style="padding-left: 10px; flex-shrink: 0">
            COS ASYNC
          </div>
          <div
            id="async_container"
            style="
              flex: 1;
              min-height: 0;
              position: relative;
              overflow: hidden;
              padding: 5px;
            "
          >
            <div class="cos-grid" id="async_grid">
              <div id="plot_async_top" class="top"></div>
              <div style="grid-column: 2; grid-row: 1"></div>
              <div id="plot_async_main" class="main"></div>
              <div id="plot_async_right" class="right"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="right-container card">
      <div class="card-title">3D CHROMATOGRAM</div>
      <div id="plot_3d" class="plot-area"></div>
    </div>
    <script>
      function getConfig(filename, width, height) {
        return {
          displaylogo: false,
          scrollZoom: false,
          responsive: true,
          modeBarButtonsToAdd: [
            {
              name: "Capture",
              icon: Plotly.Icons.camera,
              click: function (gd) {
                if (gd._fullLayout && gd._fullLayout.scene) {
                  var currentCamera = gd._fullLayout.scene._scene.getCamera();
                  Plotly.relayout(gd, { "scene.camera": currentCamera }).then(
                    function () {
                      setTimeout(function () {
                        Plotly.downloadImage(gd, {
                          format: "png",
                          filename: filename,
                          scale: 4,
                        });
                      }, 500);
                    }
                  );
                } else {
                  Plotly.downloadImage(gd, {
                    format: "png",
                    filename: filename,
                    scale: 4,
                  });
                }
              },
            },
          ],
          modeBarButtonsToRemove: [
            "toImage",
            "pan3d",
            "zoom3d",
            "select3d",
            "lasso3d",
            "hoverClosest3d",
            "zoomIn3d",
            "zoomOut3d",
            "autoScale3d",
            "zoomIn2d",
            "zoomOut2d",
            "autoScale2d",
            "zoom2d",
            "pan2d",
            "resetScale2d",
            "select2d",
            "lasso2d",
            "resetCameraDefault3d",
          ],
        };
      }

      var noBar = {
        displayModeBar: false,
        scrollZoom: false,
        responsive: true,
      };

      new QWebChannel(qt.webChannelTransport, function (channel) {
        window.pyBridge = channel.objects.pyBridge;
      });

      const gd_hm = document.getElementById("plot_hm");
      const gd_3d = document.getElementById("plot_3d");
      const gd_sync_main = document.getElementById("plot_sync_main");
      const gd_sync_top = document.getElementById("plot_sync_top");
      const gd_sync_right = document.getElementById("plot_sync_right");
      const gd_async_main = document.getElementById("plot_async_main");
      const gd_async_top = document.getElementById("plot_async_top");
      const gd_async_right = document.getElementById("plot_async_right");

      window.updateIntegrationRange = function (start_t, end_t) {
        var rangeX = { "xaxis.range": [start_t, end_t] };
        var rangeY = { "yaxis.range": [start_t, end_t] };
        Plotly.relayout(gd_sync_main, Object.assign({}, rangeX, rangeY));
        Plotly.relayout(gd_sync_top, rangeX);
        Plotly.relayout(gd_sync_right, rangeY);
        Plotly.relayout(gd_async_main, Object.assign({}, rangeX, rangeY));
        Plotly.relayout(gd_async_top, rangeX);
        Plotly.relayout(gd_async_right, rangeY);
      };

      window.updateCosData = function (
        new_time_axis,
        new_sync_z,
        new_async_z,
        sync_limit,
        async_limit,
        max_1d_height,
        new_avg_z
      ) {
        var start_t = new_time_axis[0];
        var end_t = new_time_axis[new_time_axis.length - 1];

        // sync main
        Plotly.restyle(
          gd_sync_main,
          {
            x: [new_time_axis],
            y: [new_time_axis],
            z: [new_sync_z],
            zmin: [-sync_limit],
            zmax: [sync_limit],
          },
          [0]
        );
        Plotly.relayout(gd_sync_main, {
          "xaxis.range": [start_t, end_t],
          "yaxis.range": [start_t, end_t],
        });

        // sync top
        Plotly.restyle(gd_sync_top, { x: [new_time_axis], y: [new_avg_z] }, [
          0,
        ]);
        Plotly.relayout(gd_sync_top, {
          "xaxis.range": [start_t, end_t],
          "yaxis.range": [0, max_1d_height],
        });

        // sync right
        Plotly.restyle(gd_sync_right, { x: [new_avg_z], y: [new_time_axis] }, [
          0,
        ]);
        Plotly.relayout(gd_sync_right, {
          "xaxis.range": [0, max_1d_height],
          "yaxis.range": [start_t, end_t],
        });

        // async main
        Plotly.restyle(
          gd_async_main,
          {
            x: [new_time_axis],
            y: [new_time_axis],
            z: [new_async_z],
            zmin: [-async_limit],
            zmax: [async_limit],
          },
          [0]
        );
        Plotly.relayout(gd_async_main, {
          "xaxis.range": [start_t, end_t],
          "yaxis.range": [start_t, end_t],
        });

        // async top
        Plotly.restyle(gd_async_top, { x: [new_time_axis], y: [new_avg_z] }, [
          0,
        ]);
        Plotly.relayout(gd_async_top, {
          "xaxis.range": [start_t, end_t],
          "yaxis.range": [0, max_1d_height],
        });

        // async right
        Plotly.restyle(gd_async_right, { x: [new_avg_z], y: [new_time_axis] }, [
          0,
        ]);
        Plotly.relayout(gd_async_right, {
          "xaxis.range": [0, max_1d_height],
          "yaxis.range": [start_t, end_t],
        });
      };

      let isInitialized = false;

      window.loadDataScript = function (theme, script_url) {
        try {
          if (typeof applyTheme === "function") {
            console.log("theme 적용 중");
            applyTheme(theme);
          }
        } catch (e) {
          alert("🚨 applyTheme 에러 발생: " + e);
        }

        if (script_url) {
          var script = document.createElement("script");
          script.src = script_url;
          script.onload = function () {
            renderPlots();
          };
          script.onerror = function () {
            alert("❌ 파일 로드 실패!");
          };
          document.head.appendChild(script);
        } else {
          renderPlots();
        }
      };

      function renderPlots() {
        var pkg = window.__TEMP_PLOT_DATA__;
        if (!pkg) return;

        fitSquare();

        Promise.all([
          Plotly.react(
            gd_hm,
            pkg.hm.data,
            pkg.hm.layout,
            getConfig("heatmap_result")
          ),
          Plotly.react(
            gd_3d,
            pkg.d3.data,
            pkg.d3.layout,
            getConfig("3d_surface")
          ),
          Plotly.react(
            gd_sync_main,
            pkg.sync_main.data,
            pkg.sync_main.layout,
            getConfig("sync_map")
          ),
          Plotly.react(
            gd_sync_top,
            pkg.sync_top.data,
            pkg.sync_top.layout,
            noBar
          ),
          Plotly.react(
            gd_sync_right,
            pkg.sync_right.data,
            pkg.sync_right.layout,
            noBar
          ),
          Plotly.react(
            gd_async_main,
            pkg.async_main.data,
            pkg.async_main.layout,
            getConfig("async_map")
          ),
          Plotly.react(
            gd_async_top,
            pkg.async_top.data,
            pkg.async_top.layout,
            noBar
          ),
          Plotly.react(
            gd_async_right,
            pkg.async_right.data,
            pkg.async_right.layout,
            noBar
          ),
        ])
          .then(() => {
            fitSquare();

            requestAnimationFrame(function () {
              [
                gd_sync_main,
                gd_sync_top,
                gd_sync_right,
                gd_async_main,
                gd_async_top,
                gd_async_right,
              ].forEach(function (gd) {
                if (gd && gd.data) Plotly.Plots.resize(gd);
              });

              requestAnimationFrame(function () {
                if (typeof WebLoading !== "undefined") {
                  WebLoading.hide();
                }
              });
            });

            if (
              !window.isEventsAttached &&
              typeof attachPlotlyEvents === "function"
            ) {
              attachPlotlyEvents();
              window.isEventsAttached = true;
            }
          })
          .catch((err) => {
            console.log("Plotly render error: " + err);
          });
      }

      function attachPlotlyEvents() {
        gd_hm.on("plotly_hover", function (data) {
          var px = data.points[0].x,
            py = data.points[0].y;
          Plotly.relayout(gd_hm, {
            shapes: [
              {
                type: "line",
                xref: "x domain",
                yref: "y",
                x0: 0,
                y0: py,
                x1: 1,
                y1: py,
                line: { color: "white", width: 1, dash: "dot" },
              },
              {
                type: "line",
                xref: "x",
                yref: "y domain",
                x0: px,
                y0: 0,
                x1: px,
                y1: 1,
                line: { color: "white", width: 1, dash: "dot" },
              },
            ],
          });
        });
        gd_hm.on("plotly_unhover", function () {
          Plotly.relayout(gd_hm, { shapes: [] });
        });

        gd_3d.on("plotly_click", function (data) {
          if (window.pyBridge)
            window.pyBridge.receive_sample_name(data.points[0].fullData.name);
        });
        gd_3d.on("plotly_afterplot", function () {
          requestAnimationFrame(function () {
            WebLoading.hide();
          });
        });
        gd_3d.on("plotly_hover", function (data) {
          var px = data.points[0].x,
            py = data.points[0].y;
          Plotly.relayout(gd_hm, {
            shapes: [
              {
                type: "line",
                xref: "x domain",
                yref: "y",
                x0: 0,
                y0: py,
                x1: 1,
                y1: py,
                line: { color: "white", width: 1, dash: "dot" },
              },
              {
                type: "line",
                xref: "x",
                yref: "y domain",
                x0: px,
                y0: 0,
                x1: px,
                y1: 1,
                line: { color: "white", width: 1, dash: "dot" },
              },
            ],
          });
        });
        gd_3d.on("plotly_unhover", function () {
          Plotly.relayout(gd_hm, { shapes: [] });
        });
      }

      function fitSquare() {
        ["sync_container", "async_container"].forEach(function (id) {
          var container = document.getElementById(id);
          if (!container) return;
          var grid = container.querySelector(".cos-grid");
          var w = container.clientWidth - 10;
          var h = container.clientHeight - 10;
          var size = Math.min(w, h);
          grid.style.width = size + "px";
          grid.style.height = size + "px";

          // Plotly div들에도 직접 크기 강제
          var mainDiv = grid.querySelector(".main");
          var topDiv = grid.querySelector(".top");
          var rightDiv = grid.querySelector(".right");
          var mainSize = size - 20; // grid-template-rows: 20px 1fr
          if (mainDiv) {
            mainDiv.style.width = mainSize + "px";
            mainDiv.style.height = mainSize + "px";
            mainDiv.style.maxHeight = mainSize + "px";
            mainDiv.style.overflow = "hidden";
          }
          if (topDiv) {
            topDiv.style.width = mainSize + "px";
            topDiv.style.height = "20px";
            topDiv.style.maxHeight = "20px";
            topDiv.style.overflow = "hidden";
          }
          if (rightDiv) {
            rightDiv.style.width = "20px";
            rightDiv.style.height = mainSize + "px";
            rightDiv.style.maxHeight = mainSize + "px";
            rightDiv.style.overflow = "hidden";
          }

          console.log(id + " main forced: " + mainSize + "x" + mainSize);
        });
      }

      window.addEventListener("resize", function () {
        fitSquare();
        Plotly.Plots.resize(gd_sync_main);
        Plotly.Plots.resize(gd_sync_top);
        Plotly.Plots.resize(gd_sync_right);
        Plotly.Plots.resize(gd_async_main);
        Plotly.Plots.resize(gd_async_top);
        Plotly.Plots.resize(gd_async_right);
      });
    </script>
  </body>
</html>
